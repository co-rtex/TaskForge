# Hosted continuous integration for TaskForge.
#
# This workflow runs the gates that AGENTS.md section 4 already defines for local
# development, on GitHub-hosted Linux runners, against the same PostgreSQL and
# ElasticMQ described by compose.yaml. It adds no CI-only infrastructure, no
# CI-only credentials, and no second source of truth for the toolchain version.
name: CI

on:
  # Gate every change that wants to land on main.
  pull_request:
    branches: [main]
  # And re-check main itself, so a merge result is verified even though each
  # parent was green in isolation.
  push:
    branches: [main]
  #
  # pull_request_target is deliberately absent: it evaluates the workflow from
  # the base branch while checking out untrusted head code, and nothing here
  # needs base-repository privileges.

# Least privilege. No job writes to the repository, publishes a package, or
# comments on a pull request, so the read grant is the whole grant.
permissions:
  contents: read

# One live run per pull request, or per ref for pushes to main. Superseded runs
# are cancelled rather than left holding runners for a commit nobody is waiting
# on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash --noprofile --norc -eo pipefail: a failing command in the middle of a
    # pipeline fails the step instead of being masked by the last command's
    # status.
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Fast gates: nothing here needs PostgreSQL or the broker.
  # ---------------------------------------------------------------------------
  checks:
    name: Format, lint, build, unit and OpenAPI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the whitespace gate below diffs against a real base
          # commit, which a depth-1 checkout would not contain.
          fetch-depth: 0
          # Nothing in this job pushes or calls git against the API, so the
          # checkout token must not be left behind in .git/config.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the single declaration of the language version
          # (AGENTS.md section 2). Never restate it here.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Report the resolved toolchain
        run: |
          set -euo pipefail
          go version
          go env GOVERSION GOMODCACHE GOCACHE

      - name: Check for whitespace errors and conflict markers
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # `git diff --check` with no revisions inspects the working tree, which
          # is always clean on a fresh checkout: it would pass without having
          # examined a single changed line. The range has to come from the event.
          # `:-` guards `set -u`: an expression that evaluates to nothing still
          # defines the variable, but the empty branch must not depend on that.
          case "${EVENT_NAME}" in
            pull_request)
              # base.sha is the base-branch tip when the event fired, and it is a
              # parent of the merge commit checked out above, so this range is
              # exactly what the pull request would introduce.
              base="${PR_BASE_SHA:-}"
              if [ -z "${base}" ]; then
                echo "::error::pull_request event carried no base sha"
                exit 1
              fi
              ;;
            push)
              # `before` is all zeroes when the ref was just created, and can name
              # a commit that no longer exists once history has been rewritten.
              base="${PUSH_BEFORE_SHA:-}"
              if [ -z "${base}" ] \
                || [ "${base}" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                if git rev-parse --verify --quiet "${HEAD_SHA}^" >/dev/null; then
                  base="$(git rev-parse "${HEAD_SHA}^")"
                else
                  # Root commit: compare against the empty tree.
                  base="$(git hash-object -t tree /dev/null)"
                fi
              fi
              ;;
            *)
              echo "::error::unsupported event ${EVENT_NAME}; refusing to guess a diff range"
              exit 1
              ;;
          esac

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null \
            && [ "${base}" != "$(git hash-object -t tree /dev/null)" ]; then
            echo "::error::base ${base} is not present locally; the checkout is too shallow"
            exit 1
          fi

          echo "checking ${base}..${HEAD_SHA}"
          git --no-pager diff --stat "${base}" "${HEAD_SHA}"
          git diff --check "${base}" "${HEAD_SHA}"

      - name: Formatting is already applied
        run: |
          set -euo pipefail
          # Run the repository's own formatter, then fail if it changed anything.
          # `make lint` also checks gofmt, but this proves the committed tree is
          # byte-identical to the formatter's output rather than trusting a
          # second implementation of the same check.
          make fmt
          if ! git diff --quiet --exit-code; then
            echo "::error::gofmt rewrote tracked files; run 'make fmt' and commit the result"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "gofmt made no changes"

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Unit tests
        run: make test-unit

      - name: OpenAPI parsing and contract tests
        run: |
          set -euo pipefail
          # The repository already parses api/openapi.yaml in Go, with the real
          # YAML dependency from go.mod, and cross-checks it against the error
          # contract the handlers emit. Invoking those tests by name keeps the
          # OpenAPI gate visible as its own step instead of buried inside
          # `make test-unit`, and adds no second parser or dependency.
          go test -list '^TestOpenAPI_' ./internal/api/ > "${RUNNER_TEMP}/openapi-tests.txt"
          names="$(grep '^TestOpenAPI_' "${RUNNER_TEMP}/openapi-tests.txt" || true)"
          if [ -z "${names}" ]; then
            echo "::error::no TestOpenAPI_* test matched in ./internal/api; this gate would pass vacuously"
            exit 1
          fi
          echo "matched:"
          echo "${names}"
          go test -v -count=1 -run '^TestOpenAPI_' ./internal/api/

      - name: Validate the Compose file
        run: docker compose config --quiet

  # ---------------------------------------------------------------------------
  # Integration gates: real PostgreSQL and a real broker, started the same way a
  # developer starts them.
  # ---------------------------------------------------------------------------
  integration:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Start local infrastructure
        # `make up` runs `docker compose up -d` and then scripts/wait-for-infra.sh,
        # which blocks on PostgreSQL's own pg_isready probe and on a real
        # ElasticMQ ListQueues call, each with its own bounded deadline. No sleep
        # substitutes for those probes.
        run: make up

      - name: Apply migrations to a fresh database
        # compose.yaml puts PGDATA on tmpfs, so this runner's PostgreSQL has
        # never seen a migration before this step.
        run: make migrate

      - name: Integration tests
        run: make test-integration

      - name: Build the binaries the demonstrations run
        # `make demo` and `make demo-failure` depend on `up` and `migrate`, which
        # this job has already done against its own services, so they are not
        # used here: calling `make up` again would be a second owner of the
        # infrastructure's lifecycle. The same Go program they run is.
        run: make build

      - name: Demonstration - success (make demo)
        # The program starts its own api, outbox, scheduler, reconciler and
        # worker on free loopback ports, with its own broker queue and a scope of
        # its own, and exits non-zero if any expectation fails or any wait times
        # out. Run after the integration tests, which truncate the database: it
        # never does, and asserts only on the jobs it submitted.
        #
        # The endpoints are the compose services this job started, spelled out so
        # what the program is pointed at is visible here. They are the variables
        # the services themselves read, and they are not secrets.
        env:
          TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@127.0.0.1:5442/taskforge?sslmode=disable
          TASKFORGE_BROKER_ENDPOINT: http://127.0.0.1:9324
          TASKFORGE_RESULTS_ENDPOINT: http://127.0.0.1:4566
        run: go run ./scripts/demo success

      - name: Demonstration - failure (make demo-failure)
        # A worker killed mid-job and a worker frozen mid-job. Slower than the
        # first, at about forty seconds, because it waits for real leases to lapse.
        env:
          TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@127.0.0.1:5442/taskforge?sslmode=disable
          TASKFORGE_BROKER_ENDPOINT: http://127.0.0.1:9324
          TASKFORGE_RESULTS_ENDPOINT: http://127.0.0.1:4566
        run: go run ./scripts/demo failure

      - name: Benchmark harness smoke (make bench-smoke)
        # A short run of the load generator and the fault injector against the
        # real binaries, with a worker killed mid-job. It asserts that the harness
        # produced valid measurements, and it records nothing: CI never records
        # benchmark numbers, because a shared runner's numbers are not the
        # project's (docs/adr/0020-benchmark-methodology.md).
        #
        # `make bench-smoke` is not used for the same reason the demonstrations
        # above are not: it depends on `up`, and this job has already started the
        # infrastructure. The program is the same.
        env:
          TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@127.0.0.1:5442/taskforge?sslmode=disable
          TASKFORGE_BROKER_ENDPOINT: http://127.0.0.1:9324
          TASKFORGE_RESULTS_ENDPOINT: http://127.0.0.1:4566
        run: go run ./scripts/bench smoke

      - name: Collect failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          # Best effort on purpose: no probe here may stop the teardown below.
          set -uo pipefail
          out="${RUNNER_TEMP}/taskforge-ci-diagnostics"
          mkdir -p "${out}"
          docker compose ps --all > "${out}/compose-ps.txt" 2>&1 || true
          docker compose logs --no-color --tail 400 postgres > "${out}/postgres.log" 2>&1 || true
          docker compose logs --no-color --tail 400 elasticmq > "${out}/elasticmq.log" 2>&1 || true
          docker compose logs --no-color --tail 400 objectstore > "${out}/objectstore.log" 2>&1 || true
          # The demonstrations and the benchmark smoke leave each process's own
          # log in a temporary directory and print its path. Service logs only: they never carry a
          # credential, and the empty working directory the program gives each
          # child is left behind.
          for dir in "${TMPDIR:-/tmp}"/taskforge-demo-* "${TMPDIR:-/tmp}"/taskforge-bench-*; do
            [ -d "${dir}" ] || continue
            mkdir -p "${out}/$(basename "${dir}")"
            cp "${dir}"/*.log "${out}/$(basename "${dir}")/" 2>/dev/null || true
          done
          # Echo the container inventory so the usual case needs no download.
          cat "${out}/compose-ps.txt" || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          # Container status and bounded service logs only. Never .env, never an
          # environment dump, never a database dump or request payloads.
          path: ${{ runner.temp }}/taskforge-ci-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Tear down local infrastructure
        # Runs after success, after failure, and after cancellation, so a runner
        # is never left holding this job's containers or volumes.
        if: always()
        run: docker compose down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # Python SDK. Its own job, not folded into `checks`: that job sets up Go and
  # caches by go.mod, and a Go failure and a Python failure sharing one status
  # line reads badly -- the same reason `race` below is separate. It is not in
  # `integration` either, because these tests drive the client through an
  # httpx.MockTransport and need neither PostgreSQL nor the broker.
  #
  # This job installs and runs the SDK; it does not publish it. The SDK is
  # installable from this repository and is deliberately not released to PyPI
  # before M8 -- see docs/adr/0016. The workflow's read-only permission grant
  # above stays the whole grant.
  # ---------------------------------------------------------------------------
  sdk:
    name: Python SDK (format, lint, types, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Never cancel 3.13 because 3.11 failed: which versions break is the
      # information this matrix exists to produce.
      fail-fast: false
      matrix:
        # The floor declared by requires-python, and a current release.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Report the resolved interpreter
        run: |
          set -euo pipefail
          python --version
          python -c 'import sys; print(sys.executable)'

      - name: Install the SDK with its dev extras
        # `make sdk-venv` builds the same virtualenv a developer gets locally,
        # from the same pyproject.toml, with no CI-only dependency list.
        run: make sdk-venv PYTHON=python

      - name: Format, lint, and type check
        run: make sdk-lint

      - name: Unit tests
        run: make sdk-test

  # ---------------------------------------------------------------------------
  # Operator dashboard. Its own job for the reason `sdk` has one: a different
  # toolchain, and a Go failure and a frontend failure sharing one status line
  # reads badly. Not in `integration`: its tests drive the real client through
  # a stubbed fetch and need neither PostgreSQL nor the broker.
  #
  # There is deliberately no actions/setup-node. Every step runs the same Make
  # target a developer runs, and each builds a stage of dashboard/Dockerfile,
  # whose pinned image is the single declaration of the Node version -- the
  # same "no second source of truth" rule the header applies to Go. What this
  # job proves is therefore what a contributor gets, Node never on the path.
  # See docs/adr/0017.
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard (format, lint, types, tests, build, embed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the resolved toolchain
        run: |
          set -euo pipefail
          docker version --format 'docker {{.Server.Version}}'
          grep -m1 '^FROM node' dashboard/Dockerfile

      - name: Format, lint, and type check
        run: make dash-lint

      - name: Unit tests
        run: make dash-test

      - name: Build
        run: make dash-build

      - name: The build leaves every tracked file untouched
        run: |
          set -euo pipefail
          # Build output lands in internal/dashboard/dist, which is ignored
          # except for the committed .gitkeep go:embed needs. A build that
          # modified a tracked file would dirty every contributor's tree.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::make dash-build modified the working tree"
            git status --porcelain
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Embed the build into taskforge-api
        env:
          # Turns TestAssets_BuiltOutputIsSelfConsistent's skip into a
          # failure, so this step cannot pass by having embedded nothing.
          TASKFORGE_REQUIRE_BUILT_DASHBOARD: "1"
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestAssets_' ./internal/dashboard/
          go test -count=1 -run '^TestDashboard_' ./internal/api/
          go build -o "${RUNNER_TEMP}/taskforge-api" ./cmd/taskforge-api

  # ---------------------------------------------------------------------------
  # Race detector. Separated from the integration job because it is the slowest
  # gate and its failures read very differently.
  # ---------------------------------------------------------------------------
  race:
    name: Race detector (unit and integration)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Start local infrastructure
        # This job owns its own Compose lifecycle: `make test-race` runs the
        # integration package under the race detector, so it needs its own
        # PostgreSQL and broker rather than sharing the integration job's.
        run: make up

      - name: Apply migrations to a fresh database
        run: make migrate

      - name: Race tests
        run: make test-race

      - name: Collect failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/taskforge-ci-diagnostics"
          mkdir -p "${out}"
          docker compose ps --all > "${out}/compose-ps.txt" 2>&1 || true
          docker compose logs --no-color --tail 400 postgres > "${out}/postgres.log" 2>&1 || true
          docker compose logs --no-color --tail 400 elasticmq > "${out}/elasticmq.log" 2>&1 || true
          docker compose logs --no-color --tail 400 objectstore > "${out}/objectstore.log" 2>&1 || true
          cat "${out}/compose-ps.txt" || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taskforge-ci-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Tear down local infrastructure
        if: always()
        run: docker compose down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # Container images. Its own job: it needs Docker and the dashboard build, and
  # its failures (an image that runs as root, a migrate image that applies the
  # wrong schema) read differently from a Go test failure. It owns its own
  # Compose lifecycle, like `race`: the smoke applies the migrations from the
  # migrate image to a database that has none, which would be a lie if
  # `make migrate` had already run against it.
  #
  # Nothing is pushed anywhere. The images are built for linux/amd64, the runner's
  # own architecture, and discarded with the runner; there is no registry login in
  # this workflow. See docs/adr/0021.
  # ---------------------------------------------------------------------------
  images:
    name: Container images (build, non-root, config rejection, migrate, dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # For `go run ./scripts/imagesmoke` below. The images build their own Go
        # in the Dockerfile's pinned golang image.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Start local infrastructure
        run: make up

      - name: Build the dashboard and the six images
        # `make images` builds the dashboard first (the api embeds
        # internal/dashboard/dist; without it the api image would serve a
        # placeholder), then one image per service, labelled with this commit.
        run: make images

      - name: Image smoke (make images-smoke)
        # `make images-smoke` is not used for the reason the demonstrations in the
        # integration job do not use `make demo`: it depends on `up` and `images`,
        # which this job has already done.
        #
        # On Linux the migrate and api containers run on the host network and reach
        # the compose services on loopback, spelled out here as the integration
        # job spells them.
        env:
          TASKFORGE_DATABASE_URL: postgres://taskforge:taskforge@127.0.0.1:5442/taskforge?sslmode=disable
          TASKFORGE_BROKER_ENDPOINT: http://127.0.0.1:9324
          TASKFORGE_RESULTS_ENDPOINT: http://127.0.0.1:4566
        run: go run ./scripts/imagesmoke

      - name: Collect failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/taskforge-images-diagnostics"
          mkdir -p "${out}"
          docker image ls > "${out}/images.txt" 2>&1 || true
          docker ps --all > "${out}/containers.txt" 2>&1 || true
          docker compose ps --all > "${out}/compose-ps.txt" 2>&1 || true
          docker compose logs --no-color --tail 400 postgres > "${out}/postgres.log" 2>&1 || true
          cat "${out}/images.txt" "${out}/containers.txt" || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/taskforge-images-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Tear down local infrastructure
        if: always()
        run: docker compose down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # Supply-chain scan. Its own job, for three reasons. It needs the full git
  # history (gitleaks scans every commit), which the other jobs do not fetch. It
  # needs Docker, Python and the network to the advisory databases. And its
  # failures are of a different kind: a vulnerability published tomorrow fails the
  # scan with no change to the code, and that must read as its own status line,
  # not turn `checks` red.
  #
  # It runs the command a developer runs, `make scan`, so security/scan-exceptions.yaml
  # applies identically in both places. Every tool is pinned inside the driver:
  # govulncheck at an exact tag, gitleaks by container digest (not gitleaks-action,
  # which needs a licence for organisations), pip-audit with ==, and npm audit in
  # the Node image dashboard/Dockerfile pins. See docs/adr/0021.
  # ---------------------------------------------------------------------------
  scan:
    name: Supply-chain scan (govulncheck, gitleaks, pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed and later deleted is still leaked.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Python
        # pip-audit and the SDK's clean virtualenv need a Python the workflow
        # chose, at the SDK's current CI version.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Report the resolved toolchain
        run: |
          set -euo pipefail
          go version
          python3 --version
          docker version --format 'docker {{.Server.Version}}'
          git rev-list --all --count

      - name: Scan
        run: make scan
