# ElasticMQ configuration for local TaskForge development.
#
# node-address determines the queue URLs handed back by GetQueueUrl. TaskForge
# services run on the host in this milestone, so "localhost" is the address that
# actually resolves for them.
include classpath("application.conf")

node-address {
  protocol = http
  host = "localhost"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  # Single advisory work-availability notification queue. The notification body
  # carries the TaskForge queue name; see docs/ARCHITECTURE.md section 3.
  taskforge-work-available {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
