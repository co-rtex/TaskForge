# Local development infrastructure for TaskForge.
#
# Every port is bound to 127.0.0.1 on purpose: nothing here is authenticated yet
# (see docs/CURRENT_STATE.md), so nothing here may be reachable off this machine.
name: taskforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
      # initdb needs to create the data directory itself with mode 0700,
      # so PGDATA points at a subdirectory of the tmpfs mount, not the mount.
      PGDATA: /var/lib/postgresql/data/pgdata
      # Deterministic collation so index ordering does not vary by host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5432 and 5433 are commonly taken by other local projects.
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # Local data is disposable. `make down` is expected to be destructive.
      - /var/lib/postgresql/data

  elasticmq:
    # SQS-compatible broker. See docs/adr/0005-elasticmq-for-local-broker.md.
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "127.0.0.1:9324:9324"
    volumes:
      - ./deploy/local/elasticmq.conf:/opt/elasticmq.conf:ro

  objectstore:
    # S3-compatible object store for large results. Real S3 semantics locally
    # with no AWS account and no cost -- the same reasoning
    # docs/adr/0005-elasticmq-for-local-broker.md gives for the broker,
    # applied here to storage.
    #
    # MinIO was the original choice (see docs/adr/0015-result-storage.md),
    # but its Docker Hub images are gone -- `docker pull minio/minio` and
    # `docker pull minio/mc` both answer "repository does not exist" as of
    # this milestone, independent of any local network policy. LocalStack's
    # S3 provider is the replacement: a real, actively published,
    # widely-used AWS-API-compatible emulator. Only this file and the
    # equivalent local endpoint change; internal/objectstore speaks the
    # genuine AWS S3 API against whatever endpoint it is given and has no
    # MinIO-specific code to change.
    #
    # Pinned rather than :latest, exactly like postgres and elasticmq above.
    image: localstack/localstack:4.14.0
    environment:
      # Scoped to S3 alone: the one AWS service this milestone needs, kept
      # light rather than emulating the whole platform.
      SERVICES: s3
    ports:
      # 4566 is LocalStack's single "edge" port for every emulated service.
      - "127.0.0.1:4566:4566"
    # No Docker healthcheck here, matching elasticmq above rather than
    # postgres: scripts/wait-for-infra.sh probes LocalStack's real
    # /_localstack/health endpoint from the host instead, the same way it
    # already probes ElasticMQ's ListQueues action rather than relying on a
    # binary this image may not ship.

  jaeger:
    # Optional trace backend, for looking at a trace by hand. Deliberately
    # behind a Compose profile: `make up` must not start it, because nothing in
    # this system depends on it and the test suite asserts traces through an
    # in-memory exporter rather than through a running collector.
    #
    #   docker compose --profile tracing up -d jaeger
    #   TASKFORGE_OTEL_EXPORTER=otlp TASKFORGE_OTEL_ENDPOINT=http://127.0.0.1:4318 ...
    #
    # UI on http://127.0.0.1:16686.
    #
    # Pinned rather than :latest, exactly like postgres, elasticmq and
    # localstack above.
    image: jaegertracing/all-in-one:1.65.0
    profiles: ["tracing"]
    ports:
      # OTLP/HTTP receiver -- what TASKFORGE_OTEL_ENDPOINT points at.
      - "127.0.0.1:4318:4318"
      # Jaeger's own query UI.
      - "127.0.0.1:16686:16686"
